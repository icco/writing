name: Check spelling errors
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - assigned
      - opened
      - synchronize
      - reopened
permissions:
  contents: read
  checks: write
  pull-requests: read
jobs:
  misspell:
    name: runner / misspell
    runs-on: ubuntu-latest
    steps:
      - name: Check out code.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: misspell
        uses: reviewdog/action-misspell@840bfbe9f804da9afb0bd739dc4689012f3fdd2d # v1.30.4
        with:
          locale: US
          ignore: Colour,colour
          exclude: pnpm-lock.yaml
