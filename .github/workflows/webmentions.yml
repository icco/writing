name: Send webmentions
on:
  schedule:
    - cron: 15 */6 * * *
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.16.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run webmention sender
        run: pnpm exec tsx scripts/send-webmentions.ts --send --budget-minutes=30
      - name: Authenticate state persistence
        run: 'git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf ''x-access-token:%s'' "$GH_TOKEN" | base64 -w0)"'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ !cancelled() }}
      - name: Publish sent log
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webmentions/sent.json
          if git diff --cached --quiet; then exit 0; fi
          git commit --author "GitHub Actions <actions@github.com>" -m "chore: update sent webmentions"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Could not publish webmention state after 5 attempts"
          exit 1
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45
    permissions:
      contents: write
      packages: read
concurrency:
  group: webmentions
  cancel-in-progress: false
