name: Send webmentions
on:
  schedule:
    - cron: 15 */6 * * *
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: main
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.16.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run webmention sender
        run: pnpm exec tsx scripts/send-webmentions.ts --send --budget-minutes=30
      - name: Authenticate state persistence
        run: 'git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf ''x-access-token:%s'' "$GH_TOKEN" | base64 -w0)"'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ success() || failure() }}
      - name: Commit sent log if changed
        if: ${{ success() || failure() }}
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c
        with:
          commit_message: 'chore: update sent webmentions'
          file_pattern: webmentions/sent.json
          commit_author: GitHub Actions <actions@github.com>
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          skip_fetch: true
          before_push_hook: git -c user.name="$INPUT_COMMIT_USER_NAME" -c user.email="$INPUT_COMMIT_USER_EMAIL" pull --rebase origin main
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45
    permissions:
      contents: write
      packages: read
concurrency:
  group: webmentions
  cancel-in-progress: false
